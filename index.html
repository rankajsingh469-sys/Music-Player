<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Using Tailwind Play CDN (v4 compatible script or stable v3 link works best) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Music player</title>
</head>
<body class="overflow-hidden bg-gradient-to-tr from-[#0f0a15] via-[#211235] to-[#4c1d95] min-h-screen flex items-center justify-center p-4">

    <!-- Main Card Container -->
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden flex flex-col min-h-[600px]">
        
        <!-- Top Section (White Area) -->
        <div class="p-8 flex-1 flex flex-col">
            <!-- Header -->
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold text-gray-800 flex items-center justify-center gap-2">🎧 Music Player</h1>
                <p class="text-xs text-gray-400 mt-1">Search and preview your favorite songs</p>
            </div>

            <!-- Search Form -->
                        <!-- Glassy Search Form -->
            <form action="" class="mb-8">
                <div class="flex items-center gap-3">
                    <input id="searchInput" type="text" placeholder="Search songs or artists..." 
                           class="flex-1 px-5 py-3.5 rounded-2xl border border-gray-100 bg-gray-50/30 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500/50 text-gray-700 transition-all placeholder:text-gray-400">
                    
                    <!-- The Masterpiece Liquid Chrome Glass Button -->
                    <button id="searchBtn" class="group relative overflow-hidden bg-white/20 backdrop-blur-xl border border-white/40 p-3 rounded-2xl transition-all duration-500 ease-out cursor-pointer flex items-center justify-center w-12 h-12 shrink-0 shadow-[0_4px_20px_-2px_rgba(139,92,246,0.1)] hover:shadow-[0_12px_24px_-4px_rgba(168,85,247,0.4)] hover:scale-105 active:scale-95">
                        
                        <!-- Real-time Glass Reflection Sheen (Slides right on hover) -->
                        <div class="absolute inset-0 w-[200%] h-full bg-gradient-to-r from-transparent via-white/40 to-transparent -skew-x-12 translate-x-[-120%] group-hover:translate-x-[120%] transition-transform duration-1000 ease-in-out"></div>
                        
                        <!-- Internal Radial Neon Glow Core (Ignites smoothly on hover) -->
                        <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(168,85,247,0.65)_0%,rgba(139,92,246,0)_70%)] opacity-0 group-hover:opacity-100 transition-opacity duration-500 ease-out"></div>
                        
                        <!-- Bottom Edge Prismatic Accent Ring Overlay -->
                        <div class="absolute inset-x-0 bottom-0 h-[2px] bg-gradient-to-r from-transparent via-purple-400/60 to-transparent opacity-60"></div>
                        
                        <!-- Floating Glass Icon Layer with dynamic color shift -->
                        <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5 text-purple-600 relative z-10 group-hover:text-white group-hover:drop-shadow-[0_0_8px_rgba(255,255,255,0.8)] transition-all duration-300 transform group-hover:rotate-6">
                            <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.603 10.603Z" />
                        </svg>
                        
                    </button>
                </div>
            </form>


            <!-- Search Status View Area -->
            <div class="music-container max-h-[200px] overflow-y-auto pt-2 px-1 ">
                <p class="text-center text-gray-400 text-sm">Search for a song to get started ✨</p>
            </div>
        </div>

        <!-- Bottom Player Controls Section (Purple Area) -->
        <div class="bg-[#2e1065]/50 backdrop-blur-2xl border-t border-white/20 p-6 text-white relative">
            <!-- Track Info Panel -->
             <div id="player-details">
            <div class="flex items-center gap-4 mb-6">
                <div class="bg-white/20 p-3 rounded-full flex items-center justify-center w-12 h-12 shadow-inner">
                    <span class="text-xl">🎵</span>
                </div>
                
                    <h2 class="font-semibold text-base leading-tight">No song selected</h2>
                    <p class="text-xs text-white/70 mt-0.5">Pick a track below</p>
                </div>
            </div>

            <!-- Progress Bar Area -->
            <div class="mb-6">
                <input id="timeline" type="range" class="w-full accent-white h-1 bg-white/30 rounded-lg cursor-pointer appearance-none" value="0">
                <div class="flex justify-between text-[10px] text-white/80 mt-1">
                    <span id="startTime">0:00</span>
                    <span>0:30</span>
                    <audio id="audioPlayer"></audio>
                </div>
            </div>

            <!-- Navigation Controls -->
            <div class="flex items-center justify-center gap-8">
                <button id="backBtn" class="text-white/80 hover:text-white text-xl transition cursor-pointer"><svg xmlns="http://w3.org" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
  <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>
</svg></button>
                <button id="playButton" class="bg-white text-[#8b5cf6] w-12 h-12 rounded-full flex items-center justify-center text-xl font-bold shadow-md hover:scale-105 transition cursor-pointer"><svg xmlns="http://w3.org" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
  <path d="M8 5v14l11-7z"/>
</svg></button>
                <button id="nextBtn" class="text-white/80 hover:text-white text-xl transition cursor-pointer"><svg xmlns="http://w3.org" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
  <path d="m6 18 8.5-6L6 6zm10-12h2v12h-2z"/>
</svg></button>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
